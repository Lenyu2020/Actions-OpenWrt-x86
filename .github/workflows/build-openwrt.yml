name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .diffconfig
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout main-repo
      uses: actions/checkout@v5
      with:
        path: main-repo

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Check free space
      run: df -hT

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: git clone $REPO_URL -b $REPO_BRANCH openwrt

    # cachewrtbuild 只缓存工具链/ccache，不缓存 dl/；冷启动时 linux-firmware/gcc/boost 会把 download 拖到几十分钟
    - name: Cache dl
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: openwrt-dl-${{ hashFiles('main-repo/.diffconfig') }}
        restore-keys: |
          openwrt-dl-

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        clean: 'false'
        prefix: ${{ github.workspace }}/openwrt

    - name: Install custom packages
      working-directory: openwrt
      run: |
        # 直接指定目标路径，一行命令完成创建 + 下载
        git clone -b master --depth 1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash
        git clone -b dev --depth 1 https://github.com/Blueplanet20120/luci-app-romupdate.git package/luci-app-romupdate
        git clone --depth 1 https://github.com/messense/aliyundrive-webdav.git package/aliyundrive-webdav
        git clone --depth 1 https://github.com/kuoruan/luci-app-frpc.git package/luci-app-frpc

    - name: Load custom feeds
      working-directory: openwrt
      run: |
        [ -e ../main-repo/$FEEDS_CONF ] && mv ../main-repo/$FEEDS_CONF feeds.conf.default
        chmod +x ../main-repo/$DIY_P1_SH
        ../main-repo/$DIY_P1_SH
        bash ../main-repo/lenyu.sh

    - name: Update feeds
      working-directory: openwrt
      run: ./scripts/feeds update -a

    - name: Install feeds
      working-directory: openwrt
      run: ./scripts/feeds install -a

    - name: Load custom configuration
      working-directory: openwrt
      run: |
        [ -e ../main-repo/files ] && mv ../main-repo/files files
        [ -e ../main-repo/$CONFIG_FILE ] && mv ../main-repo/$CONFIG_FILE .config
        chmod +x ../main-repo/$DIY_P2_SH
        ../main-repo/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Prepare config
      run: |
        cd openwrt
        echo -e 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y' >> .config
        
        # 1. 防 Rust 404
        if [ -f feeds/packages/lang/rust/Makefile ]; then
          sed -i '/download-ci-llvm/ s/true/false/g' feeds/packages/lang/rust/Makefile
        fi
        
        # 2. 物理剔除 ksmbd / vlmcsd（只改 config 不够，feeds 仍可能装回来）
        rm -rf package/kernel/ksmbd
        rm -rf feeds/packages/net/ksmbd-tools
        find feeds package -name "luci-app-ksmbd" -type d -exec rm -rf {} +
        find feeds package -name "autosamba" -type d -exec rm -rf {} +
        find feeds package -name "luci-app-vlmcsd" -type d -exec rm -rf {} +
        find feeds package -name "vlmcsd" -type d -exec rm -rf {} +

        make defconfig

        # 3. 与 .diffconfig 对齐：defconfig 后再锁一次，防止默认依赖把大件拉回
        disable_pkg() {
          local k="$1"
          sed -i "s/^CONFIG_${k}=y/# CONFIG_${k} is not set/" .config || true
          grep -q "^# CONFIG_${k} is not set" .config || echo "# CONFIG_${k} is not set" >> .config
        }
        disable_pkg PACKAGE_luci-app-ksmbd
        disable_pkg PACKAGE_ksmbd-server
        disable_pkg PACKAGE_autosamba
        disable_pkg PACKAGE_luci-app-vlmcsd
        disable_pkg PACKAGE_vlmcsd
        disable_pkg PACKAGE_naiveproxy
        disable_pkg PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy
        disable_pkg PACKAGE_luci-app-ssr-plus_INCLUDE_NaiveProxy
        disable_pkg PACKAGE_shadowsocks-rust
        disable_pkg PACKAGE_shadowsocks-rust-sslocal
        disable_pkg PACKAGE_shadowsocks-rust-ssserver
        disable_pkg PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client
        disable_pkg PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server
        disable_pkg PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Client
        disable_pkg PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Server
        disable_pkg PACKAGE_v2ray-core
        disable_pkg PACKAGE_vim-full
        disable_pkg PACKAGE_ruby
        disable_pkg PACKAGE_libruby
        disable_pkg PACKAGE_node
        disable_pkg PACKAGE_node-npm
        disable_pkg PACKAGE_luci-app-samba4
        disable_pkg PACKAGE_samba4-libs
        disable_pkg PACKAGE_samba4-server
        disable_pkg PACKAGE_wsdd2
        disable_pkg PACKAGE_luci-app-qbittorrent
        disable_pkg PACKAGE_luci-app-qbittorrent_static
        disable_pkg PACKAGE_qBittorrent-static
        disable_pkg PACKAGE_qBittorrent
        disable_pkg PACKAGE_boost
        make defconfig

    - name: Download package
      working-directory: openwrt
      id: package
      run: |
        make download -j$(nproc)
        # 只删下载失败的残片，保留 .hash/.sha256 等本来就很小的校验文件
        find dl -type f -size -1024c ! -name '*.hash' ! -name '*.sha256*' ! -name '*.md5' -ls -delete || true

    - name: Compile the firmware
      working-directory: openwrt
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        # 禁止失败后改成 -j1 编整个 world：单线程会把剩下几小时烧光，然后被 GitHub 6h 超时掐掉
        # 并行失败时用同样线程数再跑一次并打开日志，便于直接看到真正的编译错误
        make -j$(nproc) || make -j$(nproc) V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage (Post-compile)
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v6
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Run rename.sh
      working-directory: openwrt
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        bash ../main-repo/rename.sh

    - name: Organize files
      working-directory: openwrt
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      working-directory: openwrt
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        touch release.txt
        [ -f wget/op_version1 ] && echo "release_tag=$(cat wget/op_version1)" >> $GITHUB_OUTPUT || echo "release_tag=OpenWrt_${{ env.FILE_DATE }}" >> $GITHUB_OUTPUT
        git log --pretty=format:"%s(#By %an)" --graph --since=3.hour >> release.txt
        
        git -C feeds/packages log --pretty=format:"%s(#By %an)" --graph --since=3.hour >> release.txt || true
        git -C feeds/luci log --pretty=format:"%s(#By %an)" --graph --since=3.hour >> release.txt || true
        git -C feeds/routing log --pretty=format:"%s(#By %an)" --graph --since=3.hour >> release.txt || true
        git -C feeds/telephony log --pretty=format:"%s(#By %an)" --graph --since=3.hour >> release.txt || true
        git -C feeds/helloworld log --pretty=format:"%s(#By %an)" --graph --since=4.hour >> release.txt || true
        git -C feeds/passwall log --pretty=format:"%s(#By %an)" --graph --since=8.hour >> release.txt || true
        git -C package/luci-app-openclash log --pretty=format:"%s(#By %an)" --graph --since=8.hour >> release.txt || true
        
        test ! -s release.txt && echo -e "\n* The source code is not updated." >> release.txt
        sed -i '1i ## Firmware Update Log' release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: openwrt/release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 5

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"
        KEEP=10
        i=0
        while IFS= read -r tag; do
          if [ "$i" -ge "$KEEP" ]; then
            echo "Deleting release (and tag): $tag"
            gh release delete "$tag" --yes --cleanup-tag -R "$REPO" || true
          fi
          i=$((i + 1))
        done < <(gh api "repos/${REPO}/releases" --paginate --jq '.[] | .tag_name')
